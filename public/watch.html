<head>
<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f0f; color: #fff; font-family: Arial, sans-serif; }
header { background: #1a1a1a; padding: 15px 20px; }
header a { color: #ff4444; text-decoration: none; font-size: 20px; font-weight: bold; }
.ad-banner { text-align: center; padding: 10px; background: #111; }
.container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: flex; gap: 20px; flex-wrap: wrap; }
.main { flex: 1; min-width: 280px; }
.player { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; }
.player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
.info { margin-top: 15px; }
.info h1 { font-size: 20px; margin-bottom: 8px; }
.info span { color: #888; font-size: 14px; }
.back-btn { display: inline-block; margin-top: 15px; color: #ff4444; text-decoration: none; }
.suggested { width: 320px; }
.suggested h2 { font-size: 16px; color: #aaa; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
.s-card { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; background: #1a1a1a; border-radius: 8px; overflow: hidden; transition: transform 0.2s; }
.s-card:hover { transform: scale(1.02); }
.s-card img { width: 120px; height: 70px; object-fit: cover; flex-shrink: 0; }
.s-card .s-info { padding: 8px 8px 8px 0; display: flex; flex-direction: column; justify-content: center; }
.s-card .s-info h3 { font-size: 13px; color: #eee; line-height: 1.3; }
.s-card .s-info span { font-size: 11px; color: #888; margin-top: 4px; }
.loading { text-align: center; padding: 50px; color: #888; }
@media (max-width: 700px) {
  .container { flex-direction: column; }
  .suggested { width: 100%; }
}
</style>
<script src="https://valuedcowboysample.com/df/d1/cf/dfd1cf19fd1c64a7a5442af540a2406c.js"></script>
</head>
<body>
<header><a href="index.html">🎬 NewVideo</a></header>

<div class="ad-banner">
  <script>
    atOptions = {
      'key' : '0884225647c7532e6de503eb6348b5bb',

      'params' : {}
    };
  </script>
  <script src="https://valuedcowboysample.com/0884225647c7532e6de503eb6348b5bb/invoke.js"></script>

<div class="container">

    <div id="player-section"><div class="loading">Loading video...</div></div>
    <div class="info" id="info-section"></div>

    <div style="margin-top:20px;">
      <script async="async" data-cfasync="false" src="https://valuedcowboysample.com/aa99c1456d41d1a9e5d71334af985de3/invoke.js"></script>
      <div id="container-aa99c1456d41d1a9e5d71334af985de3"></div>

  </div>

  <div class="suggested">
    <h2>Suggested Videos</h2>
    <div id="suggested-list"><div class="loading">Loading...</div></div>

    <div style="margin-top:15px;">
      <script>
        atOptions = {
          'key' : '0884225647c7532e6de503eb6348b5bb',
          'format' : 'iframe',
          'height' : 60,
          'width' : 468,
          'params' : {}

      <script src="https://valuedcowboysample.com/0884225647c7532e6de503eb6348b5bb/invoke.js"></script>
    </div>
  </div>
</div>

<script>
const API = 'https://newvideo-backend-inuf.onrender.com';
const AD_URL = 'https://valuedcowboysample.com/bu5fn2mzf?key=89a86749e1df652f7d1d77c5c458f119';

const params = new URLSearchParams(window.location.search);
let currentId = params.get('id');

async function loadVideo(id) {
  window.scrollTo(0, 0);
  document.getElementById('player-section').innerHTML = '<div class="loading">Loading video...</div>';
  document.getElementById('info-section').innerHTML = '';
  const res = await fetch(API + '/api/videos/' + id);
  const video = await res.json();
  document.title = video.title + ' - NewVideo';
  document.getElementById('player-section').innerHTML = `
    <div class="player">
      <iframe src="${video.iframe}" allowfullscreen allow="autoplay"></iframe>
    </div>
  `;
  document.getElementById('info-section').innerHTML = `
    <h1>${video.title}</h1>
    <span>👁 ${video.views} views</span>
    <br>
    <a class="back-btn" href="index.html">← Back to Home</a>
  `;
  loadSuggested(id);
}

async function loadSuggested(excludeId) {
  const res = await fetch(API + '/api/videos');
  const videos = await res.json();
  const filtered = videos.filter(v => v._id !== excludeId).slice(0, 10);
  const list = document.getElementById('suggested-list');
  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:#666; font-size:13px;">No suggestions yet.</p>';
    return;
  }
  list.innerHTML = filtered.map(v => `
    <div class="s-card" onclick="handleClick('${v._id}')">
      <img src="${v.thumbnail}" onerror="this.src='https://via.placeholder.com/120x70/1a1a1a/888?text=No+Thumb'">
      <div class="s-info">
        <h3>${v.title}</h3>
        <span>👁 ${v.views} views</span>
      </div>
    </div>
  `).join('');
}

function handleClick(id) {
  currentId = id;
  history.pushState({}, '', 'watch.html?id=' + id);
  window.location.href = 'go.html?id=' + id;
}

loadVideo(currentId);
</script>
